name: python-playground

services:
  python:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: python-playground-dev
    container_name: python-playground
    hostname: python-playground
    working_dir: /workspace
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - .:/workspace                                             # your code, live-synced
      - uv-cache:/home/dev/.cache/uv                             # cache downloaded packages
      - shell-history:/home/dev/.history                          # keep bash history between sessions
      - ./docker/starship.toml:/home/dev/.config/starship.toml:ro # prompt edits apply without a rebuild
    # ports:
    #   - "8080:8080"   # uncomment for web examples (e.g. Django)
    init: true
    command: sleep infinity   # keep the container alive; you exec into it

volumes:
  uv-cache:
  shell-history:
